name: ASP.NET Core CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Solution projects target net8.0 (not .NET 9)
          dotnet-version: '8.0.x'

      # Use project paths instead of MyApplication.sln / .slnx so CI stays reliable on the .NET 8 SDK
      - name: Restore Dependencies
        run: |
          dotnet restore src/backend/SupportTicket.Api/SupportTicket.Api.csproj
          dotnet restore tests/SupportTicket.IntegrationTests/SupportTicket.IntegrationTests.csproj

      - name: Build Application
        run: |
          dotnet build src/backend/SupportTicket.Api/SupportTicket.Api.csproj --configuration Release --no-restore
          dotnet build tests/SupportTicket.IntegrationTests/SupportTicket.IntegrationTests.csproj --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test tests/SupportTicket.IntegrationTests/SupportTicket.IntegrationTests.csproj --configuration Release --no-build
